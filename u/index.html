<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Place App</title>
<style>
  :root { --ink: #16181d; --muted: #6b7079; --teal: #0f766e; --bg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f2f3f5; --muted: #a3a8b0; --bg: #121417; } }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 72px 16px; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 28px; }
  a.button { display: inline-block; background: var(--teal); color: #fff; text-decoration: none;
             font-weight: 600; padding: 12px 24px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Place App</h1>
  <p id="note">Photos from real places.</p>
  <a class="button" id="open" href="#" hidden>Open in the app</a>
</main>
<script>
  // /p/?id=12 is a post, /u/?id=... a profile. With the app installed,
  // Android normally opens these links in the app before this page loads.
  // If it didn't (for example inside another app's browser), the button
  // asks Chrome to open the app directly.
  var path = location.pathname.replace(/\/+$/, '');
  var id = new URLSearchParams(location.search).get('id');
  var kind = path.endsWith('/p') ? 'post' : path.endsWith('/u') ? 'profile' : null;
  if (kind && id) {
    document.getElementById('title').textContent = 'A ' + kind + ' on Place App';
    document.getElementById('note').textContent = 'Open it in the app to see it.';
    var open = document.getElementById('open');
    open.href = 'intent://' + location.host + location.pathname + location.search +
      '#Intent;scheme=https;package=com.nitin176.place_app;end';
    open.hidden = false;
  }
</script>
</body>
</html>
